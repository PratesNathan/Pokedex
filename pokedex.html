<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokedex Interativa</title>
  <link rel="stylesheet" href="/css/pokedex.css">
  <script defer src="/js/main.js"></script>
</head>
<body>
  <div class="container">
    
    
    <div class="pokemon-list">
      <ul>
        <li onclick="loadPokemon('pikachu')">Pikachu</li>
        <li onclick="loadPokemon('charmander')">Charmander</li>
        <li onclick="loadPokemon('bulbasaur')">Bulbasaur</li>
        <li onclick="loadPokemon('squirtle')">Squirtle</li>
        <li onclick="loadPokemon('eevee')">Eevee</li>
        <li onclick="loadPokemon('snorlax')">Snorlax</li>
        <li onclick="loadPokemon('gengar')">Gengar</li>
        <li onclick="loadPokemon('dragonite')">Dragonite</li>
        <li onclick="loadPokemon('lucario')">Lucario</li>
        <li onclick="loadPokemon('mewtwo')">Mewtwo</li>
      </ul>
    </div>

  
    <body>
      <div id="pokedex">
        <div id="left">
          <div id="logo"></div>
          <div id="bg_curve1_left"></div>
          <div id="bg_curve2_left"></div>
          <div id="curve1_left">
            <div id="buttonGlass">
              <div id="reflect"></div>
            </div>
            <div id="miniButtonGlass1"></div>
            <div id="miniButtonGlass2"></div>
            <div id="miniButtonGlass3"></div>
          </div>
          <div id="curve2_left">
            <div id="junction">
              <div id="junction1"></div>
              <div id="junction2"></div>
            </div>
          </div>
          <div id="screen">
            <div id="topPicture">
              <div id="buttontopPicture1"></div>
              <div id="buttontopPicture2"></div>
            </div>
            <div id="picture">
              <img id="pokemonImage" title="Click e altere imagem" height="170" />
            </div>
            <div id="buttonbottomPicture"></div>
            <div id="speakers">
              <div class="sp"></div>
              <div class="sp"></div>
              <div class="sp"></div>
              <div class="sp"></div>
            </div>
          </div>
          <div id="bigbluebutton"></div>
          <div id="barbutton1"></div>
          <div id="barbutton2"></div>
          <div id="cross">
            <div id="leftcross">
              <div id="leftT"></div>
            </div>
            <div id="topcross">
              <div id="upT"></div>
            </div>
            <div id="rightcross">
              <div id="rightT"></div>
            </div>
            <div id="midcross">
              <div id="midCircle"></div>
            </div>
            <div id="botcross">
              <div id="downT"></div>
            </div>
          </div>
        </div>
        <div id="right">
          <div id="stats">
            <strong>Name:</strong> <span id="pokemonName"></span><br />
            <strong>Type:</strong> <span id="pokemonTypes"></span><br />
            <strong>Height:</strong> <span id="pokemonHeight"></span>m<br />
            <strong>Weight:</strong> <span id="pokemonWeight"></span>kg<br />
            <strong>Skill:</strong> <span id="pokemonSkills"></span>...
          </div>
          <div id="blueButtons1">
            <div class="blueButton"></div>
            <div class="blueButton"></div>
    
      <div id="pokedex-screen">
        <img id="pokemon-image" src="" alt="Imagem do Pokémon">
      </div>
    </div>

    
    <div class="pokemon-details">
      <h2 id="pokemon-name">Selecione um Pokémon</h2>
      <p><strong>HP:</strong> <span id="pokemon-hp"></span></p>
      <p><strong>Ataque:</strong> <span id="pokemon-attack"></span></p>
      <p><strong>Habilidades:</strong> <span id="pokemon-abilities"></span></p>
      <p><strong>Próxima Evolução:</strong> <span id="pokemon-evolution"></span></p>
    </div>

  </div>
</body>
</html>
